<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MenuShowcase - Digital Restaurant Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
      // GitHub Pages SPA Single-Page App redirect script
      // Redirects 404 subpaths back to the root index.html preserving query string and path
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      window.location.replace(target);
    </script>
  </head>
  <body style="background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
      <h2>กำลังโหลดใบเมนูอาหาร...</h2>
      <p style="color:#94a3b8;font-size:14px;">Redirecting to menu showcase...</p>
    </div>
  </body>
</html>
